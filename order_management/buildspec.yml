version: 0.2

env:
  variables:
    GOCACHE: "/root/.cache/go-build"

phases:
  install:
    runtime-versions:
      golang: 1.27
    commands:
      - go version
      - pwd
      - ls -la

  pre_build:
    commands:
      - go mod download
      - go mod verify

  build:
    commands:
      # 1. Print directory structure to verify where main.go is
      - echo "Checking files in root:"
      - ls -la
      # 2. Redirect stderr and stdout directly to ensure compiler error is printed in logs
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o application . 2>&1 || (echo "=== BUILD FAILED: Check the compiler output above ===" && exit 1)

artifacts:
  files:
    - application
    - Procfile
